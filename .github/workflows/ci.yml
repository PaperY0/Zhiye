name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend-and-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm exec tsc -p packages/domain/tsconfig.json --pretty false
      - run: pnpm build
      - run: pnpm audit --audit-level moderate
      - run: pnpm --filter @zhiye/db validate
        env:
          DATABASE_URL: postgresql://zhiye:zhiye@127.0.0.1:5432/zhiye

  local-ai-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r services/local-ai/requirements-ci.txt
      - run: python -m pytest services/local-ai -q
